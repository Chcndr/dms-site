<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS — Mappa Interattiva</title>
<style>
:root{--bg:#123544;--bg2:#18495c;--ink:#f3fbff;--muted:#bfe1ea;--panel:#1a4c60cc;--stroke:#2a6a80;--accent:#10b981;--accent2:#2563eb}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 12px}
.panel{background:rgba(7,26,29,.7);border:1px solid rgba(173,234,240,.18);border-radius:16px;padding:12px}
svg{width:100%;height:auto;display:block;border-radius:16px;border:1px solid rgba(173,234,240,.18)}
.node .box{fill:#0b2230;stroke:var(--stroke);stroke-width:1.2}
.node .label{fill:#e8fbff;font-size:14px;dominant-baseline:middle;text-anchor:middle}
.node:hover .box{stroke:#2d6a73;fill:#0b2b3a;cursor:pointer}
.center{fill:#0b2b3a;stroke:var(--stroke);stroke-width:1.4}
.center .t{fill:#e8fbff;font-weight:700;font-size:18px}.center .s{fill:#9bd6de;font-size:12px}
.rotor{animation:spin 12s linear infinite; transform-origin:0 0}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.badge{display:inline-block;background:#0b2230;border:1px solid var(--stroke);color:#9bd6de;border-radius:999px;padding:4px 10px;margin:3px 6px 0 0;font-size:12px}
.badge a{color:#9bd6de;text-decoration:none}

/* Layer animazione Italia */
.bg-italy-anim{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.26; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
}

/* Contorno (si disegna) */
.it-outline{
  fill:none; stroke:#bfe9ff; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round;
  filter: drop-shadow(0 0 8px rgba(140,220,255,.6));
  stroke-dasharray:1800; stroke-dashoffset:1800;
  animation: it-draw 3.0s ease-out forwards .2s, it-glow 4s ease-in-out infinite 3.2s;
}

/* Nodi (pallini) che si accendono */
.it-node{
  fill:#d6f5ff; opacity:0;
  filter: drop-shadow(0 0 10px rgba(150,230,255,.9));
  transform-origin:center;
  animation: it-pop .6s ease-out forwards var(--delay, 0s);
}

/* Collegamenti tra nodi */
.it-link{
  stroke:#a8e7ff; stroke-width:1.8; opacity:0;
  filter: drop-shadow(0 0 6px rgba(140,220,255,.7));
  stroke-dasharray:180; stroke-dashoffset:180;
  animation: it-link 1.2s ease-out forwards var(--delay, 0s);
}

/* Keyframes */
@keyframes it-draw{ to{ stroke-dashoffset:0 } }
@keyframes it-glow{ 0%,100%{ filter:drop-shadow(0 0 6px rgba(140,220,255,.5)) } 50%{ filter:drop-shadow(0 0 14px rgba(140,220,255,.9)) } }
@keyframes it-pop{ 0%{opacity:0; transform:scale(.4)} 70%{opacity:1; transform:scale(1.2)} 100%{opacity:1; transform:scale(1)} }
@keyframes it-link{ 0%{opacity:0; stroke-dashoffset:180} 40%{opacity:1} 100%{opacity:1; stroke-dashoffset:0} }

/* Accessibilità: se l'utente preferisce meno animazioni, mostriamo tutto statico */
@media (prefers-reduced-motion: reduce){
  .it-outline{ animation:none; stroke-dashoffset:0 }
  .it-node{ animation:none; opacity:1 }
  .it-link{ animation:none; opacity:1; stroke-dashoffset:0 }
}
</style>
</head>
<body>

<!-- Italia animata sotto a tutto -->
<svg id="bgItaly" class="bg-italy-anim" viewBox="0 0 800 1100" aria-hidden="true"></svg>

<div class="wrap">
<h1>🧠 DMS — Mappa Interattiva</h1>
<p class="sub">Clicca un nodo per aprire il PDF.</p>
<a href="./home.html" class="btn" style="position:absolute;left:24px;top:22px;z-index:10;appearance:none;border:none;cursor:pointer;padding:.55rem .9rem;border-radius:12px;color:#f3fbff;background:rgba(20,80,100,.68);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);font-weight:700;text-decoration:none">← Torna alla Home</a>

<div class="panel">
<svg id="map" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="fallback" style="margin-top:10px"></div>
</div>

<script>
const NODES = [
  {label:"Riaccendiamo i Mercati", href:"./docs/dms-riaccendiamo.pdf", pub:false},
  {label:"Hub Nazionale del Commercio", href:"./docs/hub-nazionale.pdf", pub:true},
  {label:"DMS & CLUST-ER", href:"./docs/dms-e-cluster.pdf", pub:true},
  {label:"Dossier Nazionale", href:"./docs/dossier-nazionale.pdf", pub:false},
  {label:"DMS ECC (narrativo)", href:"./docs/dms-ecc.pdf", pub:false},
  {label:"DMS ECC 2 (tecnico)", href:"./docs/dms-ecc-2.pdf", pub:false},
  {label:"Carbon Credit – Logica", href:"./docs/logica-carbon-credit.pdf", pub:false},
  {label:"Equilibrio Ecosostenibile", href:"./docs/equilibrio-ecosostenibile.pdf", pub:false},
  {label:"Passaporto EU", href:"./docs/passaporto-eu.pdf", pub:false},
  {label:"DPP Explained", href:"./docs/dpp-explained.pdf", pub:false},
  {label:"Scenario Futuro", href:"./docs/scenario-futuro.pdf", pub:false},
  {label:"Gemello DMS", href:"./docs/gemello-dms.pdf", pub:false},
  {label:"Ecosistema Costi PA", href:"./docs/ecosistema-costi-pa.pdf", pub:false},
  {label:"Analisi & Soluzione", href:"./docs/analisi-soluzione-dms.pdf", pub:false}
];
const svg = document.getElementById('map'); const cx=600, cy=430, r=290;
function E(n,a){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);return e;}
svg.appendChild(E('g',{transform:`translate(${cx-160},${cy-70})`,class:'center'}))
  .innerHTML = `<rect rx="18" ry="18" width="320" height="140" class="center"/>
                <text x="160" y="58" text-anchor="middle"><tspan class="t">DMS · Hub di Prossimità</tspan><tspan x="160" dy="20" class="s">Pagamenti · Gemello GIS · Once-Only · ECC</tspan></text>`;
NODES.forEach((n,i)=>{
  const a=(2*Math.PI*i/NODES.length)-Math.PI/2, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
  svg.appendChild(E('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#a6e3eb','stroke-width':1.2,'stroke-opacity':.6}));
  const allowed = n.pub === true;
  const g=E('g',{class:'node',transform:`translate(${x-115},${y-30})`});
  g.appendChild(E('rect',{rx:12,ry:12,width:230,height:60,class:'box',opacity: allowed? '1':'0.55'}));
  const t=E('text',{x:115,y:30,class:'label',fill: allowed? '#f3fbff':'#c6d9e0'}); t.textContent=n.label; g.appendChild(t);
  if (allowed){ g.addEventListener('click',()=>location.href=n.href); }
  svg.appendChild(g);
});
const rotor=E('g',{transform:`translate(${cx},${cy})`});
rotor.innerHTML=`<circle r="${r-15}" fill="none" stroke="#a6e3eb" stroke-dasharray="6,6" stroke-opacity=".7"/><g class="rotor"><path d="M 0 -${r-15} l -8 16 l 16 0 z" fill="#14b8a6"/></g>`;
svg.appendChild(rotor);
// fallback badges
document.getElementById('fallback').innerHTML = NODES.map(n=>`<span class="badge"><a href="${n.href}" ${n.pub ? '' : 'style="opacity:.55;pointer-events:none;"'}>${n.label}</a></span>`).join('');
</script>

<script>
/**
 * Italia animata (outline → nodi → collegamenti)
 * Canvas 800x1100 (responsive via viewBox)
 */
(function(){
  const svg = document.getElementById('bgItaly');
  if(!svg) return;

  // --- Outline stilizzato (mainland + Sicilia + Sardegna) ---
  // Path "a mano" stilizzato: non geografico al millimetro, ma riconoscibile.
  // Se preferisci un profilo più preciso, sostituisci i "d" con path esportati da un SVG cartografico.
  const outline = [
    // Penisola (profilo semplificato "a stivale")
    "M400 100 C 360 120, 330 170, 320 220 C 315 260, 330 300, 350 330 C 290 370, 270 420, 285 470 C 300 515, 340 530, 370 560 C 330 590, 320 640, 330 690 C 340 740, 380 770, 415 785 C 400 820, 395 860, 410 900 C 430 945, 470 960, 505 965 C 535 970, 565 965, 580 950 C 595 935, 595 915, 580 900 C 565 885, 545 885, 525 892 C 510 897, 500 900, 490 890 C 480 880, 490 860, 500 845 C 520 815, 555 790, 580 765 C 610 735, 625 695, 620 655 C 615 615, 590 585, 560 565 C 585 545, 610 515, 620 485 C 635 435, 620 380, 585 350 C 610 310, 620 260, 600 220 C 585 190, 550 165, 515 155 C 480 145, 440 150, 400 100 Z",
    // Sicilia
    "M480 980 C 450 965, 405 960, 365 968 C 340 973, 320 990, 325 1008 C 330 1028, 355 1038, 380 1034 C 435 1026, 500 1028, 525 1015 C 542 1006, 545 990, 535 986 C 520 979, 505 985, 480 980 Z",
    // Sardegna
    "M180 820 C 160 790, 150 750, 160 715 C 170 680, 195 660, 220 658 C 245 656, 265 672, 275 698 C 288 730, 285 770, 270 800 C 255 830, 225 850, 205 845 C 190 840, 188 835, 180 820 Z"
  ];

  // --- Nodi (posizioni approssimative: Nord, Centro, Sud, isole) ---
  const nodes = [
    {x:420,y:190},{x:350,y:340},{x:560,y:330},{x:300,y:480},{x:560,y:560},
    {x:410,y:610},{x:520,y:740},{x:470,y:890},{x:380,y:1030},{x:210,y:740},{x:250,y:680},{x:580,y:470}
  ];

  // --- Collegamenti (indici dentro "nodes") ---
  const links = [
    [0,1],[0,2],[1,3],[2,4],[3,5],[4,6],[6,7],[7,8],[5,7],[9,10],[3,11],[11,4]
  ];

  // pulisci e disegna
  svg.innerHTML = '';

  // Disegna outline
  outline.forEach(d=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    p.setAttribute('class','it-outline');
    svg.appendChild(p);
  });

  // Disegna nodi (con ritardi progressivi)
  nodes.forEach((n,i)=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 4.5);
    c.setAttribute('class','it-node');
    c.style.setProperty('--delay', (0.4 + i*0.08)+'s');
    svg.appendChild(c);
  });

  // Disegna collegamenti dopo i nodi
  links.forEach((pair,i)=>{
    const a = nodes[pair[0]], b = nodes[pair[1]];
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
    l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    l.setAttribute('class','it-link');
    l.style.setProperty('--delay', (0.8 + i*0.10)+'s');
    svg.appendChild(l);
  });

  // Resize responsivo (il viewBox fa già il lavoro, qui solo debounce se servisse)
  addEventListener('resize', ()=>{/* no-op: viewBox responsive */});
})();
</script>
</body>
</html>
