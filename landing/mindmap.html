<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS — Mappa Interattiva</title>
<style>
:root{--bg:#123544;--bg2:#18495c;--ink:#f3fbff;--muted:#bfe1ea;--panel:#1a4c60cc;--stroke:#2a6a80;--accent:#10b981;--accent2:#2563eb}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 12px}
.panel{background:rgba(7,26,29,.7);border:1px solid rgba(173,234,240,.18);border-radius:16px;padding:12px}
svg{width:100%;height:auto;display:block;border-radius:16px;border:1px solid rgba(173,234,240,.18)}
.node .box{fill:#0b2230;stroke:var(--stroke);stroke-width:1.2}
.node .label{fill:#e8fbff;font-size:14px;dominant-baseline:middle;text-anchor:middle}
.node:hover .box{stroke:#2d6a73;fill:#0b2b3a;cursor:pointer}
.center{fill:#0b2b3a;stroke:var(--stroke);stroke-width:1.4}
.center .t{fill:#e8fbff;font-weight:700;font-size:18px}.center .s{fill:#9bd6de;font-size:12px}
.rotor{animation:spin 12s linear infinite; transform-origin:0 0}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.badge{display:inline-block;background:#0b2230;border:1px solid var(--stroke);color:#9bd6de;border-radius:999px;padding:4px 10px;margin:3px 6px 0 0;font-size:12px}
.badge a{color:#9bd6de;text-decoration:none}

/* nascondi collegamenti + cerchi indipendentemente dal renderer */
svg .edge, svg .link, svg .ring, svg [stroke-dasharray] { display:none !important; }

/* nascondi edges/cerchi del renderer, qualunque classe abbiano */
.mindmap-stage svg line         { display:none !important; }   /* edges */
.mindmap-stage svg path[fill="none"] { display:none !important; } /* anelli/curve */
.mindmap-stage svg circle[fill="none"] { display:none !important; }

/* contenitore node deve poter ospitare l'overlay */
.mindmap-stage .node, .mindmap-stage [role="node"] { position: relative; }

/* mini-orologio in alto a sinistra del pulsante */
.mini-clock{
  position:absolute; top:6px; left:6px; width:18px; height:18px;
  opacity:.85; pointer-events:none;
}
.mini-clock .dial{ fill:none; stroke:rgba(255,255,255,.22); stroke-width:1.5 }
.mini-clock .hand{ stroke:rgba(255,255,255,.92); stroke-width:1.5; stroke-linecap:round;
  transform-origin:9px 9px; animation:spin 4s linear infinite }
.mini-clock .tip{ fill:rgba(255,255,255,.92) }
@keyframes spin { to { transform: rotate(360deg) } }

/* il pannello centrale deve coprire mini-clock e qualsiasi residuo */
.center-slot, .mindmap-center, .info-panel {
  position:relative; z-index:50; pointer-events:auto;
}

/* header fisso nello strato di pagina */
.page-header{
  position:fixed; top:12px; left:12px; right:12px;
  display:flex; align-items:center; gap:12px;
  z-index:1100; /* sopra allo stage e ai nodi */
}
.page-header .title{
  margin:0; font:600 18px/1.2 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:#e6ecee; letter-spacing:.2px;
}

/* spaziatura per non coprire la mappa */
.page-content{ padding-top:64px; }

/* layering dello stage */
.mindmap-stage, #mindmapCanvas, .mindmap-wrapper{ position:relative; z-index:2; }

/* pulsanti sopra e sotto la mappa */
.chips-top, .chips-bottom{
  position:sticky; z-index:1100; pointer-events:auto;
}
.chips-top{ top:64px; margin-bottom:8px; }
.chips-bottom{ bottom:0; margin-top:8px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }

.btn{
  appearance:none;border:none;cursor:pointer;padding:.55rem .9rem;border-radius:12px;
  color:#e6ecee;background:rgba(20,80,100,.68);border:2px solid rgba(255,255,255,.2);
  backdrop-filter:blur(6px);font:600 14px/1.2 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-decoration:none
}
</style>
</head>
<body>


<header class="page-header">
  <a href="./home.html" class="btn back">← Torna alla Home</a>
  <h1 class="title">DMS — Mappa interattiva</h1>
</header>

<div class="wrap page-content">
<p class="sub">Clicca un nodo per aprire il PDF.</p>

<div class="panel">
<svg id="map" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="fallback" style="margin-top:10px"></div>
</div>

<script>
const NODES = [
  {label:"Riaccendiamo i Mercati", href:"./docs/dms-riaccendiamo.pdf", pub:false},
  {label:"Hub Nazionale del Commercio", href:"./docs/hub-nazionale.pdf", pub:true},
  {label:"DMS & CLUST-ER", href:"./docs/dms-e-cluster.pdf", pub:true},
  {label:"Dossier Nazionale", href:"./docs/dossier-nazionale.pdf", pub:false},
  {label:"DMS ECC (narrativo)", href:"./docs/dms-ecc.pdf", pub:false},
  {label:"DMS ECC 2 (tecnico)", href:"./docs/dms-ecc-2.pdf", pub:false},
  {label:"Carbon Credit – Logica", href:"./docs/logica-carbon-credit.pdf", pub:false},
  {label:"Equilibrio Ecosostenibile", href:"./docs/equilibrio-ecosostenibile.pdf", pub:false},
  {label:"Passaporto EU", href:"./docs/passaporto-eu.pdf", pub:false},
  {label:"DPP Explained", href:"./docs/dpp-explained.pdf", pub:false},
  {label:"Scenario Futuro", href:"./docs/scenario-futuro.pdf", pub:false},
  {label:"Gemello DMS", href:"./docs/gemello-dms.pdf", pub:false},
  {label:"Ecosistema Costi PA", href:"./docs/ecosistema-costi-pa.pdf", pub:false},
  {label:"Analisi & Soluzione", href:"./docs/analisi-soluzione-dms.pdf", pub:false}
];
const svg = document.getElementById('map'); const cx=600, cy=430, r=290;
function E(n,a){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);return e;}
svg.appendChild(E('g',{transform:`translate(${cx-160},${cy-70})`,class:'center center-slot'}))
  .innerHTML = `<rect rx="18" ry="18" width="320" height="140" class="center"/>
                <text x="160" y="58" text-anchor="middle"><tspan class="t">DMS · Hub di Prossimità</tspan><tspan x="160" dy="20" class="s">Pagamenti · Gemello GIS · Once-Only · ECC</tspan></text>`;
NODES.forEach((n,i)=>{
  const a=(2*Math.PI*i/NODES.length)-Math.PI/2, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
  svg.appendChild(E('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#a6e3eb','stroke-width':1.2,'stroke-opacity':.6}));
  const allowed = n.pub === true;
  const g=E('g',{class:'node',transform:`translate(${x-115},${y-30})`});
  g.appendChild(E('rect',{rx:12,ry:12,width:230,height:60,class:'box',opacity: allowed? '1':'0.55'}));
  const t=E('text',{x:115,y:30,class:'label',fill: allowed? '#f3fbff':'#c6d9e0'}); t.textContent=n.label; g.appendChild(t);
  if (allowed){ g.addEventListener('click',()=>location.href=n.href); }
  svg.appendChild(g);
});
const rotor=E('g',{transform:`translate(${cx},${cy})`});
rotor.innerHTML=`<circle r="${r-15}" fill="none" stroke="#a6e3eb" stroke-dasharray="6,6" stroke-opacity=".7"/><g class="rotor"><path d="M 0 -${r-15} l -8 16 l 16 0 z" fill="#14b8a6"/></g>`;
svg.appendChild(rotor);
// fallback badges
document.getElementById('fallback').innerHTML = NODES.map(n=>`<span class="badge"><a href="${n.href}" ${n.pub ? '' : 'style="opacity:.55;pointer-events:none;"'}>${n.label}</a></span>`).join('');
</script>

<script>
// fallback: se il renderer usa classi diverse, spegniamo gli elementi disegnati
window.addEventListener('load', () => {
  const s = document.querySelector('.mindmap-stage svg'); if(!s) return;
  s.querySelectorAll('line, path, circle').forEach(el=>{
    const fill = el.getAttribute('fill') || getComputedStyle(el).fill || '';
    if (el.tagName === 'line' || fill === 'none' || fill === 'rgba(0, 0, 0, 0)') {
      el.style.display = 'none';
    }
  });
});
</script>

<script>
(function(){
  const ns = 'http://www.w3.org/2000/svg';
  function addMiniClock(el){
    if(el.querySelector('.mini-clock')) return;
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('class','mini-clock'); svg.setAttribute('viewBox','0 0 18 18');

    const dial = document.createElementNS(ns,'circle');
    dial.setAttribute('class','dial'); dial.setAttribute('cx','9'); dial.setAttribute('cy','9'); dial.setAttribute('r','8');
    const hand = document.createElementNS(ns,'line');
    hand.setAttribute('class','hand'); hand.setAttribute('x1','9'); hand.setAttribute('y1','9'); hand.setAttribute('x2','9'); hand.setAttribute('y2','2.8');
    const tip = document.createElementNS(ns,'polygon');
    tip.setAttribute('class','tip'); tip.setAttribute('points','9,1.4 7.9,3.6 10.1,3.6');

    svg.appendChild(dial); svg.appendChild(hand); svg.appendChild(tip);
    el.appendChild(svg);
  }

  function initClocks(){
    document.querySelectorAll('.mindmap-stage .node, .mindmap-stage [role="node"]').forEach(addMiniClock);
  }

  window.addEventListener('load', initClocks);
  // nel caso i nodi vengano rigenerati in ritardo
  setTimeout(initClocks, 300);
})();
</script>
</body>
</html>
