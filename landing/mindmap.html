<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS — Mappa Interattiva</title>
<style>
:root{--bg:#071a1d;--ink:#e8fbff;--muted:#9bd6de;--stroke:#1b3a46;--accent:#14b8a6}
body{margin:0;background:#071a1d;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 12px}
.panel{background:rgba(7,26,29,.7);border:1px solid rgba(173,234,240,.18);border-radius:16px;padding:12px}
svg{width:100%;height:auto;display:block;border-radius:16px;border:1px solid rgba(173,234,240,.18)}
.node .box{fill:#0b2230;stroke:var(--stroke);stroke-width:1.2}
.node .label{fill:#e8fbff;font-size:14px;dominant-baseline:middle;text-anchor:middle}
.node:hover .box{stroke:#2d6a73;fill:#0b2b3a;cursor:pointer}
.center{fill:#0b2b3a;stroke:var(--stroke);stroke-width:1.4}
.center .t{fill:#e8fbff;font-weight:700;font-size:18px}.center .s{fill:#9bd6de;font-size:12px}
.badge{display:inline-block;background:#0b2230;border:1px solid var(--stroke);color:#9bd6de;border-radius:999px;padding:4px 10px;margin:3px 6px 0 0;font-size:12px}
.badge a{color:#9bd6de;text-decoration:none}
.btn{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid #2d6a73;background:#0b2730;color:#e8fbff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="btn" href="./home.html?v=ok1">← Torna all'Orologio</a>
  <h1>🧠 DMS — Mappa Interattiva</h1>
  <p class="sub">Clicca un nodo per aprire il PDF.</p>

  <div class="panel">
    <svg id="map" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div id="fallback" style="margin-top:10px"></div>
</div>

<script>
const NODES = [
  ["DMS – Riaccendiamo i Mercati","./docs/dms-riaccendiamo.pdf"],
  ["Hub Nazionale del Commercio","./docs/hub-nazionale.pdf"],
  ["Dossier Nazionale","./docs/dossier-nazionale.pdf"],
  ["DMS & CLUST-ER","./docs/dms-e-cluster.pdf"],
  ["DMS ECC (narrativo)","./docs/dms-ecc.pdf"],
  ["DMS ECC 2 (tecnico)","./docs/dms-ecc-2.pdf"],
  ["Carbon Credit – Logica","./docs/logica-carbon-credit.pdf"],
  ["Equilibrio Ecosostenibile","./docs/equilibrio-ecosostenibile.pdf"],
  ["Passaporto EU","./docs/passaporto-eu.pdf"],
  ["DPP Explained","./docs/dpp-explained.pdf"],
  ["Scenario Futuro","./docs/scenario-futuro.pdf"],
  ["Gemello DMS","./docs/gemello-dms.pdf"],
  ["Ecosistema Costi PA","./docs/ecosistema-costi-pa.pdf"],
  ["Analisi & Soluzione","./docs/analisi-soluzione-dms.pdf"]
];

const svg = document.getElementById('map'); const cx=600, cy=430, r=290;
function E(n,a){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);return e;}
svg.appendChild(E('g',{transform:`translate(${cx-160},${cy-70})`,class:'center'}))
  .innerHTML = `<rect rx="18" ry="18" width="320" height="140" class="center"/>
                <text x="160" y="58" text-anchor="middle">
                  <tspan class="t">DMS · Hub di Prossimità</tspan>
                  <tspan x="160" dy="20" class="s">Pagamenti · Gemello GIS · Once-Only · ECC</tspan>
                </text>`;

NODES.forEach((n,i)=>{
  const a=(2*Math.PI*i/NODES.length)-Math.PI/2, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
  svg.appendChild(E('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#a6e3eb','stroke-width':1.2,'stroke-opacity':.6}));
  const g=E('g',{class:'node',transform:`translate(${x-115},${y-30})`});
  g.appendChild(E('rect',{rx:12,ry:12,width:230,height:60,class:'box'}));
  const t=E('text',{x:115,y:30,class:'label'}); t.textContent=n[0]; g.appendChild(t);
  g.addEventListener('click',()=>location.href=n[1]); svg.appendChild(g);
});

// fallback badges sotto la mappa
document.getElementById('fallback').innerHTML =
  NODES.map(n=>`<span class="badge"><a href="${n[1]}">${n[0]}</a></span>`).join('');
</script>
</body>
</html>
