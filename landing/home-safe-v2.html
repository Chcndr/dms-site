<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS — Gemello Digitale (safe v2)</title>
<style>
/* ——— NAMESPACE .mm- per evitare collisioni ——— */
:root{
  --mm-bg1:#0c3e45; --mm-bg2:#125965; --mm-t:#e7f3f3; --mm-m:#a7bcc0;
  --mm-ac:#5cf2ff; --mm-ac2:rgba(92,242,255,.28);
}
.mm-reset,*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 780px at 70% -10%,var(--mm-bg2),var(--mm-bg1));color:var(--mm-t);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}

.mm-header{position:fixed;left:16px;top:16px;z-index:40;display:flex;gap:10px}
.mm-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;text-decoration:none;color:#ecffff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.mm-btn:hover{box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 14px var(--mm-ac2) inset}

.mm-title{position:fixed;right:16px;top:18px;margin:0;text-align:right;font-weight:700;letter-spacing:.02em;z-index:40}
.mm-title small{display:block;color:var(--mm-m);font-weight:500}

.mm-main{min-height:100%;padding:96px 24px 48px;display:grid;place-items:center}
.mm-stage{position:relative;width:min(1100px,96vw);/* blocchiamo le misure in modo stabile */
  height:min(680px, calc(96vw * 9/16 + 280px)); /* lascia spazio ai nodi */
}

/* viewport centrale 16:9 */
.mm-viewport{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(90%,980px);aspect-ratio:16/9;border-radius:18px;overflow:hidden;z-index:30;
  box-shadow:0 22px 60px rgba(0,0,0,.40)}
.mm-viewport::before{content:"";position:absolute;inset:-6%;border-radius:24px;z-index:-1;
  background:radial-gradient(140% 120% at 50% 50%,rgba(92,242,255,.22),transparent 62%),
             radial-gradient(80% 60% at 50% 50%,rgba(255,255,255,.07),transparent 70%);
  filter:blur(14px)}
.mm-viewport video,.mm-viewport iframe{width:100%;height:100%;display:block;object-fit:cover;background:#0a3035}

/* cerchio nodi: dimensione indipendente, niente vh */
.mm-ring{position:absolute;inset:0;pointer-events:none}
.mm-nodes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(76vmin,620px);height:min(76vmin,620px);pointer-events:none}
.mm-node{--i:0;--R:calc(min(76vmin,620px)/2 - 72px);
  position:absolute;left:50%;top:50%;
  width:clamp(72px,9vmin,120px);height:clamp(72px,9vmin,120px);
  transform:
    rotate(calc(var(--i)*30deg))
    translate(var(--R))
    rotate(calc(var(--i)*-30deg));
  transform-origin:center;
  display:grid;place-items:center;border-radius:16px;text-decoration:none;color:#e9feff;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  box-shadow:0 14px 26px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.05) inset;
  transition:transform .18s ease, box-shadow .2s ease, background .2s ease;
  pointer-events:auto; z-index:20;
}
.mm-node:hover{
  transform:
    rotate(calc(var(--i)*30deg)) translate(calc(var(--R) + 6px)) rotate(calc(var(--i)*-30deg));
  background:rgba(0,208,255,.10);
  box-shadow:0 22px 48px rgba(0,0,0,.40),0 0 18px rgba(92,242,255,.35),0 0 0 1px rgba(92,242,255,.32) inset
}

@media (max-width:860px){
  .mm-viewport{width:min(94%,760px)}
}

/* hard fix iPad BFC/scroll: impedisce che elementi "escano" */
.mm-stage{contain:layout paint}
</style>
</head>
<body class="mm-reset">
  <nav class="mm-header">
    <a class="mm-btn" href="../index.html">🎬 Spot</a>
    <a class="mm-btn" href="./mindmap.html">🧠 Mappa</a>
  </nav>
  <h1 class="mm-title">GEMELLO DIGITALE<small>DMS • Orologio roadmap (safe v2)</small></h1>

  <main class="mm-main">
    <section class="mm-stage">
      <div class="mm-ring">
        <div class="mm-nodes">
          <a class="mm-node" style="--i:0"  href="./docs/hub-nazionale.pdf" target="_blank">PDF</a>
          <a class="mm-node" style="--i:1"  href="./docs/dms-e-cluster.pdf" target="_blank">PDF</a>
          <a class="mm-node" style="--i:2"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:3"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:4"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:5"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:6"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:7"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:8"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:9"  href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:10" href="#" title="Prossimamente">•</a>
          <a class="mm-node" style="--i:11" href="#" title="Prossimamente">•</a>
        </div>
      </div>

      <div id="mm-viewport" class="mm-viewport">
        <video id="mm-hero" muted playsinline autoplay loop
          src="./videos/video-hero.mp4" poster="../assets/italy.svg"></video>
      </div>
    </section>
  </main>

<script>
/* Facoltativo: apri PDF/video nella finestra centrale; fallback: nuova scheda */
(function(){
  const vp = document.getElementById('mm-viewport');
  document.querySelectorAll('.mm-node').forEach(a=>{
    a.addEventListener('click',e=>{
      const href=a.getAttribute('href')||'#';
      if(href.endsWith('.pdf')){ e.preventDefault(); vp.innerHTML='<iframe src="'+href+'#view=fitH" loading="lazy" style="width:100%;height:100%;border:0"></iframe>'; }
      else if(href.endsWith('.mp4')){ e.preventDefault(); vp.innerHTML='<video muted playsinline autoplay controls src="'+href+'" style="width:100%;height:100%"></video>'; }
    });
  });
  window.addEventListener('pageshow',()=>{
    const v=document.getElementById('mm-hero'); if(v&&v.paused){ v.play().catch(()=>{}); }
  });
})();
</script>
</body>
</html>
