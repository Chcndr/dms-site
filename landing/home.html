<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS — Gemello Digitale (Home)</title>
<style>
  :root{
    --bg-a:#0e2d38; --bg-b:#155268;
    --ink:#dde2e4; --accent:#46a0bd;
    --panel:#0c2028;
    --btnFill:rgba(20,80,100,.68);
    --btnStroke:rgba(190,230,240,.95);
    --btnW:140px;
    --radius:16px;
  }
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    background: radial-gradient(1200px 800px at 60% 20%, #1b5a71, transparent 60%),
                linear-gradient(180deg, var(--bg-b), var(--bg-a));
    font: 16px/1.4 system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }

  /* disattiva PNG statico (se presente) */
  body::before{ display:none !important; }

  /* Layer animazione Italia */
  .bg-italy-anim{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.26; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }

  /* Contorno (si disegna) */
  .it-outline{
    fill:none; stroke:#bfe9ff; stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round;
    filter: drop-shadow(0 0 8px rgba(140,220,255,.6));
    stroke-dasharray:1800; stroke-dashoffset:1800;
    animation: it-draw 3.0s ease-out forwards .2s, it-glow 4s ease-in-out infinite 3.2s;
  }

  /* Nodi (pallini) che si accendono */
  .it-node{
    fill:#d6f5ff; opacity:0;
    filter: drop-shadow(0 0 10px rgba(150,230,255,.9));
    transform-origin:center;
    animation: it-pop .6s ease-out forwards var(--delay, 0s);
  }

  /* Collegamenti tra nodi */
  .it-link{
    stroke:#a8e7ff; stroke-width:1.8; opacity:0;
    filter: drop-shadow(0 0 6px rgba(140,220,255,.7));
    stroke-dasharray:180; stroke-dashoffset:180;
    animation: it-link 1.2s ease-out forwards var(--delay, 0s);
  }

  /* Keyframes */
  @keyframes it-draw{ to{ stroke-dashoffset:0 } }
  @keyframes it-glow{ 0%,100%{ filter:drop-shadow(0 0 6px rgba(140,220,255,.5)) } 50%{ filter:drop-shadow(0 0 14px rgba(140,220,255,.9)) } }
  @keyframes it-pop{ 0%{opacity:0; transform:scale(.4)} 70%{opacity:1; transform:scale(1.2)} 100%{opacity:1; transform:scale(1)} }
  @keyframes it-link{ 0%{opacity:0; stroke-dashoffset:180} 40%{opacity:1} 100%{opacity:1; stroke-dashoffset:0} }

  /* Accessibilità: se l'utente preferisce meno animazioni, mostriamo tutto statico */
  @media (prefers-reduced-motion: reduce){
    .it-outline{ animation:none; stroke-dashoffset:0 }
    .it-node{ animation:none; opacity:1 }
    .it-link{ animation:none; opacity:1; stroke-dashoffset:0 }
  }

  /* garantisci layer */
  .ellipse-layer{ z-index:1; } .node{ z-index:2; } .viewport{ z-index:3; }

  .claim{
    position:fixed; right:24px; top:28px; z-index:4;
    text-align:right; letter-spacing:.02em;
    margin:0; line-height:1.1;
  }
  .claim b{display:block; font-size:28px}
  .claim small{display:block; opacity:.8; font-size:14px; margin-top:6px}

  .toolbar{
    position:fixed; left:20px; top:20px; z-index:4; display:flex; gap:8px;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    padding:.55rem .9rem; border-radius:12px;
    color:var(--ink); background:var(--btnFill);
    border:2px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px);
    font-weight:700;
  }

  .ellipse-layer{ position:fixed; inset:0; z-index:1; pointer-events:none; }
  .ellipse-layer .tick{
    stroke: rgba(220,245,255,.6);
    stroke-width:2; stroke-linecap:round;
  }
  .ellipse-layer .center-dot{ fill:rgba(255,255,255,.7) }
  #hand{
    stroke: rgba(255,255,255,.9);
    stroke-width:3; stroke-linecap:round;
  }

  .node{
    position:fixed; width:var(--btnW); height:var(--btnW);
    border-radius:16px; z-index:2;
    border: 2px solid var(--btnStroke);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    color: var(--ink);
    display:grid; place-items:center;
    box-shadow: 0 10px 22px rgba(0,0,0,.28), inset 0 0 0 0 rgba(255,255,255,.15);
    backdrop-filter: blur(4px);
    transition: transform .15s ease;
  }
  .node:hover{ transform: translateY(-2px) }
  .node .tag{ opacity:.9; font-weight:700; }

  .viewport{
    position:fixed; z-index:3;
    border-radius:20px; overflow:hidden;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.28);
    box-shadow: 0 18px 40px rgba(0,0,0,.4);
  }
  .viewport video, .viewport iframe{ width:100%; height:100%; display:block; border:0 }

  /* utility bottoni dentro pannello */
  .btn-prim{ padding:.6rem 1rem; border-radius:10px; border:2px solid var(--accent);
             background:var(--btnFill); color:var(--ink); font-weight:700; }
  .btn-sec{  padding:.6rem 1rem; border-radius:10px; border:1px solid rgba(255,255,255,.2);
             background:transparent; color:var(--ink); }

  @media (max-width:1200px){ :root{ --btnW:120px } }
  @media (max-width:820px){  :root{ --btnW:96px }  }
</style>
</head>
<body>

  <!-- Italia animata sotto a tutto -->
  <svg id="bgItaly" class="bg-italy-anim" viewBox="0 0 800 1100" aria-hidden="true"></svg>

  <div class="toolbar">
    <a class="btn" href="./index.html">🎬 Spot</a>
    <a class="btn" href="./mindmap.html">🧠 Mappa</a>
  </div>

  <h1 class="claim">
    <b>GEMELLO DIGITALE</b>
    <b>DEL COMMERCIO</b>
    <small>DMS • Orologio roadmap</small>
  </h1>

  <svg id="ellipseLayer" class="ellipse-layer" aria-hidden="true"></svg>
  <div id="viewport" class="viewport" role="region" aria-label="contenuti"></div>

<script>
  let modules=null, viewport=null, svg=null;

  function makeNodes(){
    const frag = document.createDocumentFragment();
    for(let i=0;i<12;i++){
      const b = document.createElement('button');
      b.className = 'node'; b.dataset.i = i;
      b.innerHTML = `<span class="tag">PDF</span>`;
      frag.appendChild(b);
    }
    document.body.appendChild(frag);
  }

  async function loadModules(){
    if(modules) return modules;
    try{
      const res = await fetch('./data/modules.json?v='+Date.now());
      if(!res.ok) throw new Error('modules.json '+res.status);
      modules = await res.json();
    }catch(e){
      console.warn('modules.json non disponibile:', e);
      modules = []; // non blocca la UI
    }
    return modules;
  }

  function ensureHero(){
    if(!viewport) return;
    const exists = viewport.querySelector('video,iframe');
    if(exists) return;
    viewport.innerHTML = '';
    const v = document.createElement('video');
    v.src = './videos/video-hero.mp4?v=5';
    v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
    v.setAttribute('playsinline','');
    viewport.appendChild(v);
    v.play?.().catch(()=>{ /* iOS può richiedere gesture, ma manterremo muto */ });
  }

  function renderPanel(m){
    const box=document.createElement('div');
    box.style.cssText="display:flex;flex-direction:column;gap:10px;padding:18px;height:100%;overflow:auto";
    box.innerHTML=`
      <div style="font-size:1.2rem;font-weight:800">${m.title||'Modulo'}</div>
      <div><b>Quando:</b> ${m.when||'-'}</div>
      <div><b>Norme:</b> ${m.law||'-'}</div>
      <div><b>Ministeri/Enti:</b> ${m.ministry||'-'}</div>
      <div><b>Dati:</b> ${m.data||'-'}</div>
      <div><b>Output:</b> ${m.output||'-'}</div>
      <div><b>Dipendenze:</b> ${m.depends||'-'}</div>
      <div style="margin-top:auto;display:flex;gap:10px">
        <button id="more" class="btn-prim">APPROFONDISCI</button>
        <button id="back" class="btn-sec">Torna al video</button>
      </div>`;
    viewport.innerHTML=''; viewport.appendChild(box);
    box.querySelector('#more').onclick=()=>{
      if(m.pdf && m.pdf!="#"){
        const f=document.createElement('iframe'); f.src=m.pdf; f.style.cssText="width:100%;height:100%;border:0";
        viewport.innerHTML=''; viewport.appendChild(f);
      }
    };
    box.querySelector('#back').onclick=()=>{ viewport.innerHTML=''; ensureHero(); };
  }

  function bindNodes(){
    document.querySelectorAll('.node').forEach((el)=>{
      el.onclick = async ()=>{
        const i = +el.dataset.i;
        const mods = await loadModules();
        const m = mods[i] || null;
        if(!m || m.pdf==="#" ){ 
          viewport.innerHTML = '<div style="display:grid;place-items:center;height:100%;color:#cfe8f0;font-weight:700">· presto</div>';
          return;
        }
        // se c'è PDF → apri direttamente PDF nel riquadro
        const f = document.createElement('iframe');
        f.src = m.pdf; f.style.cssText="width:100%;height:100%;border:0";
        viewport.innerHTML=''; viewport.appendChild(f);
      };
    });
  }

  function layout(){
    viewport = document.getElementById('viewport');
    svg = document.getElementById('ellipseLayer');
    if(!viewport || !svg){ console.error('contenitori mancanti'); return; }

    const W=innerWidth, H=innerHeight, cx=W/2, cy=H*0.50;
    // dimensione pulsanti adattiva
    let btnW = Math.max(96, Math.min(Math.round(W*0.09), 150));
    document.documentElement.style.setProperty('--btnW', btnW+'px');

    // ellisse (ovalizzata)
    const a=Math.min(W*0.46, W/2-24), b=Math.min(H*0.34, H/2-36);

    // viewport 16:9 dentro ellisse interna
    const innerA=a-btnW*0.60, innerB=b-btnW*0.60;
    let vw=W*0.62, vh=vw*9/16, maxH=H*0.44;
    if(vh>maxH){ vh=maxH; vw=vh*16/9; }
    let k=1;
    while(((((vw*k)/2)**2)/(innerA**2)+(((vh*k)/2)**2)/(innerB**2))>1 && k>0.4){ k-=0.02; }
    vw*=k; vh*=k;

    viewport.style.cssText = `width:${vw}px;height:${vh}px;left:${cx-vw/2}px;top:${cy-vh/2}px`;

    // ticks + lancetta
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML='';
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); svg.appendChild(g);
    for(let i=0;i<12;i++){
      const t=-Math.PI/2 + 2*Math.PI*i/12;
      const ix=cx+(a-18)*Math.cos(t), iy=cy+(b-18)*Math.sin(t);
      const ex=cx+a*Math.cos(t),      ey=cy+b*Math.sin(t);
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',ix); ln.setAttribute('y1',iy); ln.setAttribute('x2',ex); ln.setAttribute('y2',ey);
      ln.setAttribute('class','tick'); g.appendChild(ln);
    }
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',10); c.setAttribute('class','center-dot'); g.appendChild(c);
    const hand=document.createElementNS('http://www.w3.org/2000/svg','line');
    hand.id='hand'; hand.setAttribute('x1',cx); hand.setAttribute('y1',cy); hand.setAttribute('x2',cx); hand.setAttribute('y2',cy); g.appendChild(hand);
    const tip=document.createElementNS('http://www.w3.org/2000/svg','polygon'); tip.id='handTip'; tip.setAttribute('fill',getComputedStyle(document.documentElement).getPropertyValue('--ink')); g.appendChild(tip);

    // posiziona i 12 pulsanti con safe-area per non tagliare ai bordi
    const sX = 12, sY = 96, sR = 12; // padding laterale/alto e raggio minimo bordo
    document.querySelectorAll('.node').forEach((el,i)=>{
      const t = -Math.PI/2 + 2*Math.PI*i/12;
      let x = cx + a*Math.cos(t) - btnW/2;
      let y = cy + b*Math.sin(t) - btnW/2;
      // clamp entro viewport
      x = Math.max(sX, Math.min(W - btnW - sX, x));
      y = Math.max(sY, Math.min(H - btnW - sR, y));
      el.style.left = x+'px';
      el.style.top  = y+'px';
    });

    // animazione lancetta
    let start=null; function anim(ts){
      if(!start) start=ts;
      const T=12000, th=-Math.PI/2 + 2*Math.PI*((ts-start)%T)/T;
      const px=cx+a*Math.cos(th)*0.95, py=cy+b*Math.sin(th)*0.95;
      hand.setAttribute('x2',px); hand.setAttribute('y2',py);
      const bx=cx+a*Math.cos(th)*0.86, by=cy+b*Math.sin(th)*0.86, nx=-Math.sin(th), ny=Math.cos(th), tipW=18;
      tip.setAttribute('points',`${px},${py} ${bx+nx*tipW},${by+ny*tipW} ${bx-nx*tipW},${by-ny*tipW}`);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  // bootstrap
  document.addEventListener('DOMContentLoaded', ()=>{
    makeNodes();
    layout();
    ensureHero();
    bindNodes();
  });
  addEventListener('resize', layout);
  addEventListener('pageshow', ensureHero);
</script>

<script>
/**
 * Italia animata (outline → nodi → collegamenti)
 * Canvas 800x1100 (responsive via viewBox)
 */
(function(){
  const svg = document.getElementById('bgItaly');
  if(!svg) return;

  // --- Outline stilizzato (mainland + Sicilia + Sardegna) ---
  // Path "a mano" stilizzato: non geografico al millimetro, ma riconoscibile.
  // Se preferisci un profilo più preciso, sostituisci i "d" con path esportati da un SVG cartografico.
  const outline = [
    // Penisola (profilo semplificato "a stivale")
    "M400 100 C 360 120, 330 170, 320 220 C 315 260, 330 300, 350 330 C 290 370, 270 420, 285 470 C 300 515, 340 530, 370 560 C 330 590, 320 640, 330 690 C 340 740, 380 770, 415 785 C 400 820, 395 860, 410 900 C 430 945, 470 960, 505 965 C 535 970, 565 965, 580 950 C 595 935, 595 915, 580 900 C 565 885, 545 885, 525 892 C 510 897, 500 900, 490 890 C 480 880, 490 860, 500 845 C 520 815, 555 790, 580 765 C 610 735, 625 695, 620 655 C 615 615, 590 585, 560 565 C 585 545, 610 515, 620 485 C 635 435, 620 380, 585 350 C 610 310, 620 260, 600 220 C 585 190, 550 165, 515 155 C 480 145, 440 150, 400 100 Z",
    // Sicilia
    "M480 980 C 450 965, 405 960, 365 968 C 340 973, 320 990, 325 1008 C 330 1028, 355 1038, 380 1034 C 435 1026, 500 1028, 525 1015 C 542 1006, 545 990, 535 986 C 520 979, 505 985, 480 980 Z",
    // Sardegna
    "M180 820 C 160 790, 150 750, 160 715 C 170 680, 195 660, 220 658 C 245 656, 265 672, 275 698 C 288 730, 285 770, 270 800 C 255 830, 225 850, 205 845 C 190 840, 188 835, 180 820 Z"
  ];

  // --- Nodi (posizioni approssimative: Nord, Centro, Sud, isole) ---
  const nodes = [
    {x:420,y:190},{x:350,y:340},{x:560,y:330},{x:300,y:480},{x:560,y:560},
    {x:410,y:610},{x:520,y:740},{x:470,y:890},{x:380,y:1030},{x:210,y:740},{x:250,y:680},{x:580,y:470}
  ];

  // --- Collegamenti (indici dentro "nodes") ---
  const links = [
    [0,1],[0,2],[1,3],[2,4],[3,5],[4,6],[6,7],[7,8],[5,7],[9,10],[3,11],[11,4]
  ];

  // pulisci e disegna
  svg.innerHTML = '';

  // Disegna outline
  outline.forEach(d=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    p.setAttribute('class','it-outline');
    svg.appendChild(p);
  });

  // Disegna nodi (con ritardi progressivi)
  nodes.forEach((n,i)=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 4.5);
    c.setAttribute('class','it-node');
    c.style.setProperty('--delay', (0.4 + i*0.08)+'s');
    svg.appendChild(c);
  });

  // Disegna collegamenti dopo i nodi
  links.forEach((pair,i)=>{
    const a = nodes[pair[0]], b = nodes[pair[1]];
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
    l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    l.setAttribute('class','it-link');
    l.style.setProperty('--delay', (0.8 + i*0.10)+'s');
    svg.appendChild(l);
  });

  // Resize responsivo (il viewBox fa già il lavoro, qui solo debounce se servisse)
  addEventListener('resize', ()=>{/* no-op: viewBox responsive */});
})();
</script>
</body>
</html>
