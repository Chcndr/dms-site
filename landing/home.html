<style>@keyframes cityPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(92,242,255,.70))}50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(92,242,255,.95))}}
/* Layering: PDF > VIDEO > LANCETTA > sfondo */
.stage{ position:relative; }
.viewport{ position:relative; }
.media-16x9{ position:relative; z-index:3; }  /* il video deve stare SOPRA la lancetta */
.pdf-node{ position:absolute; z-index:4; }    /* i PDF restano sopra a tutto */

/* Disattiva ed elimina QUALSIASI lancetta vecchia */
.dms-pointer, .clock-pointer, .pointer, .minute-hand, .second-hand{ display:none !important; }

/* NUOVA lancetta (unica). La parte dentro al video NON si vedrà,
   perché la lancetta sta sotto al layer del video. */
.clock-needle{
  position:absolute; left:0; top:0;
  width:2px; height:var(--len,200px);
  transform-origin:50% 100%;
  transform:translate(var(--cx,0px), var(--cy,0px)) rotate(var(--deg,0deg));
  background:rgba(255,255,255,.95);
  border-radius:2px; box-shadow:0 0 10px rgba(255,255,255,.35);
  pointer-events:none; z-index:2;               /* SOTTO al video (.media-16x9) */
  transition:height .12s linear;
}
/* Punta triangolare attaccata (niente stacchi) */
.clock-needle::after{
  content:""; position:absolute; left:50%; top:0;
  transform:translate(-50%, -100%);
  border:10px solid transparent; border-bottom-color:rgba(255,255,255,.95);
  filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
}
:root{
  --neon:#7eeaff;
  --neon-soft: rgba(126,234,255,.18);
}

/* Rimuovi la "i" (tooltip ora legale) */
.top-right small, .info, .tooltip, [data-tip] { display:none !important; }

/* clock sotto il video */
#ellipseLayer{ z-index:1; pointer-events:none; }
#mouseGlow{ pointer-events:none; }

/* mouse glow sotto tutto il contenuto interattivo */
#mouseGlow{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(240px 240px at var(--mx,50%) var(--my,50%),
      var(--neon-soft), transparent 60%);
  transition: background-position .06s linear;
}

/* video con alone soft (retroilluminazione discreta) */
.viewport{
  box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 80px var(--neon-soft);
}

/* pulsanti: mantieni il tuo hover; aggiungo una leggera spinta */
.node:hover{ transform: translateY(-2px); z-index:20; }
.node{ z-index:20; }
.viewport{ z-index:30; }

/* (opzionale) spegne la "i" di debug se presente */
.info, .info-toggle, [data-role="info"]{ display:none !important; }
/* Solo la lancetta. Qualsiasi overlay residuo va spento */
#teaser,.teaser,.overlay,[data-role="teaser"],[data-role="overlay"]{display:none!important}
/* Disattiva qualunque lancetta di test */
.dms-pointer{ display:none !important; }
/* Spegne icone/overlay che coprono il video */
.video-overlay, .teaser, #teaser, [data-role="teaser"], [data-role="overlay"]{ display:none !important; }

// 2.c) Video hero che parte davvero su iOS
function ensureAutoplay(v){
  v.muted = true; v.autoplay = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
  const play = () => v.play().catch(()=> setTimeout(play,300));
  if (v.readyState >= 2) play(); else v.addEventListener('loadeddata', play, {once:true});
  v.addEventListener('error', ()=>{ v.src = './videos/teaser-hub-dms.mp4'; ensureAutoplay(v); }, {once:true});
}
function createHero(){
  const v = document.createElement('video');
  v.src = './videos/video-hero.mp4'; v.style.background = '#000';
  v.controls = false;
  ensureAutoplay(v);
  return v;
}

// 2.d) Layout con ellisse non tagliata
function layout(){
  const W = innerWidth, H = innerHeight;
  const cx = W/2, cy = H*0.50;
  const btnW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--btnW')) || 180;

  // margine di sicurezza ai lati = metà bottone + 16px
  const SAFE = (btnW/2) + 16;

  // semiassi: non possono superare i bordi utili
  const a = Math.min(W*0.46, cx - SAFE, W - cx - SAFE);
  const b = Math.min(H*0.34, cy - SAFE, H - cy - SAFE);

  // ridisegna ticks + lancetta
  const svg = document.getElementById('ellipseLayer');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  const g = document.createElementNS('http://www.w3.org/2000/svg','g'); svg.appendChild(g);

  for(let i=0;i<12;i++){
    const t = -Math.PI/2 + (2*Math.PI*i/12);
    const ix = cx + (a-18)*Math.cos(t), iy = cy + (b-18)*Math.sin(t);
    const ex = cx + a*Math.cos(t),      ey = cy + b*Math.sin(t);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', ix); line.setAttribute('y1', iy);
    line.setAttribute('x2', ex); line.setAttribute('y2', ey);
    line.setAttribute('stroke', 'rgba(185,240,255,.9)'); line.setAttribute('stroke-width','3');
    g.appendChild(line);
  }

  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 10);
  c.setAttribute('fill','rgba(0,0,0,.55)'); c.setAttribute('stroke','#dce8eb'); c.setAttribute('stroke-width','3');
  g.appendChild(c);

  const hand = document.createElementNS('http://www.w3.org/2000/svg','line');
  hand.setAttribute('id','hand'); hand.setAttribute('x1', cx); hand.setAttribute('y1', cy);
  hand.setAttribute('x2', cx); hand.setAttribute('y2', cy);
  hand.setAttribute('stroke','#dce8eb'); hand.setAttribute('stroke-width','12'); hand.setAttribute('stroke-linecap','round');
  g.appendChild(hand);

  const tip = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  tip.setAttribute('fill','#dce8eb'); g.appendChild(tip);

  // posiziona i 12 nodi e clampa per ulteriore sicurezza
  const nodes = [...document.querySelectorAll('.node')];
  nodes.forEach((el,i)=>{
    const t = -Math.PI/2 + (2*Math.PI*i/12);
    let x = cx + a*Math.cos(t) - btnW/2;
    let y = cy + b*Math.sin(t) - btnW/2;
    
    // clampa ai bordi per sicurezza
    x = Math.max(8, Math.min(x, W - btnW - 8));
    y = Math.max(8, Math.min(y, H - btnW - 8));
    
    el.style.left = x+'px'; 
    el.style.top = y+'px';
  });

  // animazione: giro completo 12s
  let start=null;
  function anim(ts){
    if(!start) start = ts;
    const T = 12000;                         // 12 secondi per un giro
    const theta = -Math.PI/2 + 2*Math.PI*((ts-start)%T)/T;
    const px = cx + a*Math.cos(theta)*0.95;  // punta quasi al bordo
    const py = cy + b*Math.sin(theta)*0.95;
    hand.setAttribute('x2', px); hand.setAttribute('y2', py);

    const bx = cx + a*Math.cos(theta)*0.86;
    const by = cy + b*Math.sin(theta)*0.86;
    const nx = -Math.sin(theta), ny = Math.cos(theta);
    const tipW=18;
    tip.setAttribute('points', `${px},${py} ${bx+nx*tipW},${by+ny*tipW} ${bx-nx*tipW},${by-ny*tipW}`);

    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

const view = document.getElementById('viewport');
const nodes = [...document.querySelectorAll('.node')];

function loadContent(item){

  if(!item){
    const p = document.createElement('div');
    p.style.cssText='display:grid;place-items:center;height:100%;color:#cfe8f0;font-weight:700;opacity:.85';
    p.textContent = '· presto';
    view.appendChild(p);
    return;
  }
  if(item.type === 'video'){
    const v = document.createElement('video');
    v.src = item.url; v.controls = true; v.autoplay = true; v.muted = false;
    v.playsInline = true; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    view.appendChild(v);
  } else if(item.type === 'pdf'){
    const f = document.createElement('iframe');
    f.src = item.url + '#view=FitH'; f.style.cssText='width:100%;height:100%;border:0';
    view.appendChild(f);
  }
}

nodes.forEach((el,i)=>{
  el.addEventListener('click', (e)=>{
    e.preventDefault();
    const item = CONTENT[i];
    if (item) loadContent(item);
  });
});

// primo load con video hero
view.innerHTML = '';
view.appendChild(createHero());

// chiamala su resize e inizialmente
window.addEventListener('resize', layout, {passive:true});
layout();

// mouse glow
(function mouseGlow(){
  const el = document.getElementById('mouseGlow');
  if(!el) return;
  const set = (x,y) => {
    el.style.setProperty('--mx', x+'px');
    el.style.setProperty('--my', y+'px');
  };
  window.addEventListener('mousemove', e => set(e.clientX, e.clientY), {passive:true});
  set(innerWidth/2, innerHeight/2);
})();

// autoplay safety
window.addEventListener('pageshow', ()=> {
  const v = view.querySelector('video'); if(v){ v.muted=true; v.play().catch(()=>{}); }
});
</script>
</body>
