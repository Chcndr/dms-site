<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS — Gemello Digitale (Home)</title>
<style>
  :root{
    --bg-a:#0e2d38; --bg-b:#155268;
    --ink:#dde2e4; --accent:#46a0bd;
    --panel:#0c2028;
    --btnFill:rgba(20,80,100,.68);
    --btnStroke:rgba(190,230,240,.95);
    --btnW:140px;
    --radius:16px;
    /* Palette neon */
    --neon:#5cf2ff;               /* ciano chiaro */
    --neon-2:#00d0ff;             /* ciano saturo */
    --neon-hot:#8af7ff;           /* highlight */
    --node-bg:rgba(6,32,38,.28);  /* card bg */
    --node-br:rgba(255,255,255,.22);
  }
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    background: radial-gradient(1200px 800px at 60% 20%, #1b5a71, transparent 60%),
                linear-gradient(180deg, var(--bg-b), var(--bg-a));
    font: 16px/1.4 system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }

  /* BACKGROUND ITALIA ANIMATA */
  .bg-italy-anim{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* gradient di sfondo con movimento molto lento */
  .bg-italy-anim .bg-gradient{
    position:absolute; inset:-10%;
    background:
      radial-gradient(120% 80% at 20% 10%, #0f3b44 0%, transparent 40%),
      radial-gradient(100% 100% at 85% 90%, #0a2c33 0%, transparent 55%),
      linear-gradient(180deg, #0a3a43, #0c2f35 60%, #0a2b31);
    filter:contrast(1.02) saturate(1.04);
    animation:pan 22s linear infinite;
    opacity:.96;
  }
  @keyframes pan{
    0%{transform:translate3d(0,0,0)}
    50%{transform:translate3d(2%,-1.5%,0)}
    100%{transform:translate3d(0,0,0)}
  }

  /* posizionamento Italia */
  #italySVG{
    position:absolute; right:3vw; bottom:-6vh;
    width:min(1400px,95vw); height:auto;
    opacity:.22;
    filter:drop-shadow(0 0 10px rgba(92,242,255,.08));
  }

  /* stile per italy-clean.svg */
  .bg-italy-anim svg{ color:var(--neon); }
  .bg-italy-anim svg polyline,
  .bg-italy-anim svg line{ fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }

  /* breathing leggero dopo il draw */
  .bg-italy-anim.lit svg polyline{ animation:breath 6s ease-in-out infinite; }
  @keyframes breath{ 0%,100%{opacity:.24;filter:blur(0)} 50%{opacity:.34;filter:blur(.2px)} }

  /* spotlight che segue il mouse (mix-blend screen) */
  .bg-italy-anim .spotlight{
    position:absolute; inset:0;
    background:
      radial-gradient(320px 220px at var(--mx,50%) var(--my,50%), rgba(92,242,255,.14), transparent 60%),
      radial-gradient(160px 120px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.04), transparent 70%);
    mix-blend-mode:screen;
    opacity:0; transition:opacity .25s ease;
  }

  /* ===== Retro-illuminazione viewport (finestra video) ===== */
  .viewport, .hero{
    position:relative;
    z-index:30;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    border-radius: 16px;
  }
  .viewport::before, .hero::before{
    content:"";
    position:absolute; inset:-4%;
    border-radius: 20px;
    background:
      radial-gradient(140% 120% at 50% 50%, rgba(92,242,255,.22), transparent 60%),
      radial-gradient(80% 60%  at 50% 50%, rgba(255,255,255,.06), transparent 70%);
    filter: blur(12px);
    z-index:-1; opacity:.9; pointer-events:none;
  }

  /* isola lo stacking della pagina */
  body, .content-layer{ position:relative; isolation:isolate; }

  /* orologio SEMPRE sotto */
  .clock-layer, .ellipse-layer{
    position:fixed; inset:0; z-index:1; pointer-events:none;
  }

  /* pulsanti sopra all'orologio */
  .nodes-layer, .node{
    position:relative; z-index:20;
  }

  /* modulo centrale sopra ai pulsanti */
  .viewport{
    position:relative; z-index:30;
  }

  /* header/CTA ancora sopra (se presenti) */
  header, .site-nav, .top-buttons{ position:relative; z-index:40; }

  /* sicurezza: impedisci che filtri/transform dei parent creino stacking imprevisti */
  .nodes-layer, .viewport{
    transform:translateZ(0); /* non crea nuovo stacking context rilevante */
    filter:none !important;  mix-blend-mode:normal !important;
  }

  /* lancetta/ellisse non devono intercettare clic */
  #ellipseLayer, #ellipseLayer *, #clockSVG, #clockSVG *{ pointer-events:none !important; }



  .claim{
    position:fixed; right:24px; top:28px; z-index:40;
    text-align:right; letter-spacing:.02em;
    margin:0; line-height:1.1;
  }
  .claim b{display:block; font-size:28px}
  .claim small{display:block; opacity:.8; font-size:14px; margin-top:6px}

  .toolbar{
    position:fixed; left:20px; top:20px; z-index:40; display:flex; gap:8px;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    padding:.55rem .9rem; border-radius:12px;
    color:var(--ink); background:var(--btnFill);
    border:2px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px);
    font-weight:700;
  }

  .ellipse-layer{ position:fixed; inset:0; z-index:1; pointer-events:none; }
  .ellipse-layer .tick{
    stroke: rgba(220,245,255,.6);
    stroke-width:2; stroke-linecap:round;
  }
  .ellipse-layer .center-dot{ fill:rgba(255,255,255,.7) }
  #hand{
    stroke: rgba(255,255,255,.9);
    stroke-width:3; stroke-linecap:round;
  }

  /* ——— NEON SCOPED ALLA HOME ——— */
  .home-orologio .nodes-layer{ position:relative; z-index:20; }

  .home-orologio .node{
    /* NON modifichiamo width/height/posizione: restano quelli esistenti */
    position:fixed; width:var(--btnW); height:var(--btnW);
    border-radius:16px; z-index:2;
    border:1.5px solid rgba(255,255,255,.22);
    background:rgba(6,32,38,.28); color:#e6ecee;
    display:grid; place-items:center;
    backdrop-filter:blur(4px);
    isolation:isolate;              /* per i pseudo sotto */
    transition: transform .15s ease;
  }

  /* Ombra sotto (scurisce il fondo) */
  .home-orologio .node::after{
    content:""; position:absolute; inset:auto 10% -14px 10%;
    height:30px; border-radius:22px;
    background:radial-gradient(60% 90% at 50% 20%, rgba(0,0,0,.38), transparent 70%);
    filter:blur(10px); z-index:-1; pointer-events:none;
  }

  /* Glow neon (solo cosmetico) */
  .home-orologio .node::before{
    content:""; position:absolute; inset:-2px; border-radius:16px;
    background:
      radial-gradient(120% 120% at 50% 50%, rgba(92,242,255,.35), transparent 60%),
      conic-gradient(from 0deg, #5cf2ff, #00d0ff, #5cf2ff, #00d0ff);
    opacity:0; filter:blur(8px);
    transition:opacity .18s ease, filter .18s ease, box-shadow .18s ease;
    z-index:-1; pointer-events:none;
  }

  /* Stati interattivi: niente scale, solo luce + bordo */
  .home-orologio .node:hover,
  .home-orologio .node:focus-visible,
  .home-orologio .node.is-active{
    border-color:color-mix(in oklab, #5cf2ff 75%, white);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08) inset,
      0 0 14px rgba(92,242,255,.25),
      0 8px 24px rgba(0,0,0,.35);
  }
  .home-orologio .node:hover::before,
  .home-orologio .node:focus-visible::before,
  .home-orologio .node.is-active::before{ opacity:.9; filter:blur(10px); }

  /* Accessibilità focus senza spostare il layout */
  .home-orologio .node:focus-visible{
    outline:2px solid #8af7ff; outline-offset:3px;
  }

  .home-orologio .node:hover{ transform: translateY(-2px) }
  .home-orologio .node .tag{ opacity:.9; font-weight:700; }

  .viewport{
    position:fixed; z-index:3;
    border-radius:20px; overflow:hidden;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.28);
    box-shadow: 0 18px 40px rgba(0,0,0,.4);
  }
  .viewport video, .viewport iframe{ width:100%; height:100%; display:block; border:0 }

  /* utility bottoni dentro pannello */
  .btn-prim{ padding:.6rem 1rem; border-radius:10px; border:2px solid var(--accent);
             background:var(--btnFill); color:var(--ink); font-weight:700; }
  .btn-sec{  padding:.6rem 1rem; border-radius:10px; border:1px solid rgba(255,255,255,.2);
             background:transparent; color:var(--ink); }

  @media (max-width:1200px){ :root{ --btnW:120px } }
  @media (max-width:820px){  :root{ --btnW:96px }  }

  @media (max-width: 900px){
    .nodes-layer .node{ transform: scale(.92); }
    .viewport{ width:min(90vw, 960px); }
  }

  @media (prefers-reduced-motion: reduce){
    .home-orologio .node, .home-orologio .node::before{ transition:none !important; }
    .bg-italy-anim .bg-gradient{ animation:none; }
    .bg-italy-anim.lit svg polyline{ animation:none; }
    .bg-italy-anim .spotlight{ display:none; }
  }
</style>
</head>
<body class="home-orologio">

  <!-- BACKGROUND ITALIA ANIMATA -->
  <div class="bg-italy-anim" aria-hidden="true">
    <div class="bg-gradient"></div>
    <object id="italySVG" type="image/svg+xml" data="./assets/italy-clean.svg?v=clean1"></object>
    <div class="spotlight"></div>
  </div>

  <div class="toolbar">
    <a class="btn" href="./index.html">🎬 Spot</a>
    <a class="btn" href="./mindmap.html">🧠 Mappa</a>
  </div>

  <h1 class="claim">
    <b>GEMELLO DIGITALE</b>
    <b>DEL COMMERCIO</b>
    <small>DMS • Orologio roadmap</small>
  </h1>

  <svg id="ellipseLayer" class="ellipse-layer" aria-hidden="true"></svg>
  <div id="viewport" class="viewport" role="region" aria-label="contenuti"></div>

<script>
  let modules=null, viewport=null, svg=null;

  function makeNodes(){
    const frag = document.createDocumentFragment();
    for(let i=0;i<12;i++){
      const b = document.createElement('button');
      b.className = 'node'; b.dataset.i = i;
      b.innerHTML = `<span class="tag">PDF</span>`;
      frag.appendChild(b);
    }
    document.body.appendChild(frag);
  }

  async function loadModules(){
    if(modules) return modules;
    try{
      const res = await fetch('./data/modules.json?v='+Date.now());
      if(!res.ok) throw new Error('modules.json '+res.status);
      modules = await res.json();
    }catch(e){
      console.warn('modules.json non disponibile:', e);
      modules = []; // non blocca la UI
    }
    return modules;
  }

  function ensureHero(){
    if(!viewport) return;
    const exists = viewport.querySelector('video,iframe');
    if(exists) return;
    viewport.innerHTML = '';
    const v = document.createElement('video');
    v.src = './videos/video-hero.mp4?v=5';
    v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
    v.setAttribute('playsinline','');
    viewport.appendChild(v);
    v.play?.().catch(()=>{ /* iOS può richiedere gesture, ma manterremo muto */ });
  }

  function renderPanel(m){
    const box=document.createElement('div');
    box.style.cssText="display:flex;flex-direction:column;gap:10px;padding:18px;height:100%;overflow:auto";
    box.innerHTML=`
      <div style="font-size:1.2rem;font-weight:800">${m.title||'Modulo'}</div>
      <div><b>Quando:</b> ${m.when||'-'}</div>
      <div><b>Norme:</b> ${m.law||'-'}</div>
      <div><b>Ministeri/Enti:</b> ${m.ministry||'-'}</div>
      <div><b>Dati:</b> ${m.data||'-'}</div>
      <div><b>Output:</b> ${m.output||'-'}</div>
      <div><b>Dipendenze:</b> ${m.depends||'-'}</div>
      <div style="margin-top:auto;display:flex;gap:10px">
        <button id="more" class="btn-prim">APPROFONDISCI</button>
        <button id="back" class="btn-sec">Torna al video</button>
      </div>`;
    viewport.innerHTML=''; viewport.appendChild(box);
    box.querySelector('#more').onclick=()=>{
      if(m.pdf && m.pdf!="#"){
        const f=document.createElement('iframe'); f.src=m.pdf; f.style.cssText="width:100%;height:100%;border:0";
        viewport.innerHTML=''; viewport.appendChild(f);
      }
    };
    box.querySelector('#back').onclick=()=>{ viewport.innerHTML=''; ensureHero(); };
  }

  function bindNodes(){
    document.querySelectorAll('.node').forEach((el)=>{
      el.onclick = async ()=>{
        const i = +el.dataset.i;
        const mods = await loadModules();
        const m = mods[i] || null;
        if(!m || m.pdf==="#" ){ 
          viewport.innerHTML = '<div style="display:grid;place-items:center;height:100%;color:#cfe8f0;font-weight:700">· presto</div>';
          return;
        }
        // se c'è PDF → apri direttamente PDF nel riquadro
        const f = document.createElement('iframe');
        f.src = m.pdf; f.style.cssText="width:100%;height:100%;border:0";
        viewport.innerHTML=''; viewport.appendChild(f);
      };
    });
  }

  function layout(){
    viewport = document.getElementById('viewport');
    svg = document.getElementById('ellipseLayer');
    if(!viewport || !svg){ console.error('contenitori mancanti'); return; }

    const W=innerWidth, H=innerHeight, cx=W/2, cy=H*0.50;
    // dimensione pulsanti adattiva
    let btnW = Math.max(96, Math.min(Math.round(W*0.09), 150));
    document.documentElement.style.setProperty('--btnW', btnW+'px');

    // ellisse (ovalizzata)
    const a=Math.min(W*0.46, W/2-24), b=Math.min(H*0.34, H/2-36);

    // viewport 16:9 dentro ellisse interna
    const innerA=a-btnW*0.60, innerB=b-btnW*0.60;
    let vw=W*0.62, vh=vw*9/16, maxH=H*0.44;
    if(vh>maxH){ vh=maxH; vw=vh*16/9; }
    let k=1;
    while(((((vw*k)/2)**2)/(innerA**2)+(((vh*k)/2)**2)/(innerB**2))>1 && k>0.4){ k-=0.02; }
    vw*=k; vh*=k;

    viewport.style.cssText = `width:${vw}px;height:${vh}px;left:${cx-vw/2}px;top:${cy-vh/2}px`;

    // ticks + lancetta
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML='';
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); svg.appendChild(g);
    for(let i=0;i<12;i++){
      const t=-Math.PI/2 + 2*Math.PI*i/12;
      const ix=cx+(a-18)*Math.cos(t), iy=cy+(b-18)*Math.sin(t);
      const ex=cx+a*Math.cos(t),      ey=cy+b*Math.sin(t);
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',ix); ln.setAttribute('y1',iy); ln.setAttribute('x2',ex); ln.setAttribute('y2',ey);
      ln.setAttribute('class','tick'); g.appendChild(ln);
    }
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',10); c.setAttribute('class','center-dot'); g.appendChild(c);
    const hand=document.createElementNS('http://www.w3.org/2000/svg','line');
    hand.id='hand'; hand.setAttribute('x1',cx); hand.setAttribute('y1',cy); hand.setAttribute('x2',cx); hand.setAttribute('y2',cy); g.appendChild(hand);
    const tip=document.createElementNS('http://www.w3.org/2000/svg','polygon'); tip.id='handTip'; tip.setAttribute('fill',getComputedStyle(document.documentElement).getPropertyValue('--ink')); g.appendChild(tip);

    // posiziona i 12 pulsanti con safe-area per non tagliare ai bordi
    const sX = 12, sY = 96, sR = 12; // padding laterale/alto e raggio minimo bordo
    document.querySelectorAll('.node').forEach((el,i)=>{
      const t = -Math.PI/2 + 2*Math.PI*i/12;
      let x = cx + a*Math.cos(t) - btnW/2;
      let y = cy + b*Math.sin(t) - btnW/2;
      // clamp entro viewport
      x = Math.max(sX, Math.min(W - btnW - sX, x));
      y = Math.max(sY, Math.min(H - btnW - sR, y));
      el.style.left = x+'px';
      el.style.top  = y+'px';
    });

    // animazione lancetta
    let start=null; function anim(ts){
      if(!start) start=ts;
      const T=12000, th=-Math.PI/2 + 2*Math.PI*((ts-start)%T)/T;
      const px=cx+a*Math.cos(th)*0.95, py=cy+b*Math.sin(th)*0.95;
      hand.setAttribute('x2',px); hand.setAttribute('y2',py);
      const bx=cx+a*Math.cos(th)*0.86, by=cy+b*Math.sin(th)*0.86, nx=-Math.sin(th), ny=Math.cos(th), tipW=18;
      tip.setAttribute('points',`${px},${py} ${bx+nx*tipW},${by+ny*tipW} ${bx-nx*tipW},${by-ny*tipW}`);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  // bootstrap
  document.addEventListener('DOMContentLoaded', ()=>{
    makeNodes();
    layout();
    ensureHero();
    bindNodes();
  });
  addEventListener('resize', layout);
  addEventListener('pageshow', ensureHero);
</script>

<script>
(()=>{const ns=[...document.querySelectorAll('.home-orologio .nodes-layer .node')];
ns.forEach(n=>{ if(n.getAttribute('aria-disabled')==='true') return;
  n.addEventListener('click',()=>ns.forEach(m=>m.classList.toggle('is-active',m===n)));
});})();
</script>

<script>
(function(){
  const wrapper = document.querySelector('.bg-italy-anim');
  const obj = document.getElementById('italySVG');
  const spot = wrapper.querySelector('.spotlight');

  function draw(doc){
    const segs = doc.querySelectorAll('polyline, line');
    segs.forEach((el,i)=>{
      const L = (typeof el.getTotalLength === 'function') ? el.getTotalLength() : 600;
      el.style.strokeDasharray=L;
      el.style.strokeDashoffset=L;
      el.style.transition=`stroke-dashoffset 1100ms ease ${i*60}ms`;
    });
    requestAnimationFrame(()=> segs.forEach(el=> el.style.strokeDashoffset=0));
    setTimeout(()=> wrapper.classList.add('lit'), 1400);
  }

  obj.addEventListener('load', ()=> draw(obj.contentDocument));
  if (obj.contentDocument) draw(obj.contentDocument);

  // spotlight (desktop)
  let raf;
  function move(e){
    const x=e.clientX||(e.touches&&e.touches[0].clientX);
    const y=e.clientY||(e.touches&&e.touches[0].clientY);
    if(!x&& !y) return;
    if(!raf){
      raf=requestAnimationFrame(()=>{ wrapper.style.setProperty('--mx',x+'px'); wrapper.style.setProperty('--my',y+'px'); raf=null;});
    }
    spot.style.opacity=.9;
  }
  function leave(){ spot.style.opacity=0; }
  window.addEventListener('mousemove', move, {passive:true});
  window.addEventListener('mouseleave', leave, {passive:true});
  window.addEventListener('touchstart', ()=>{ spot.style.display='none'; }, {once:true, passive:true});
})();
</script>


</body>
</html>
