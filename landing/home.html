<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS · Gemello del Commercio — Home (stabile)</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg-a:#0b2730; --bg-b:#071a1d;            /* tema verde scuro elegante */
    --ink:#e8fbff; --ink-2:#9bd6de;            /* testi */
    --accent:#14b8a6;                          /* teal DMS */
    --btnW: 140px;                             /* verrà adattato da JS */
    --vw: 960px;                               /* larghezza viewport video/pannello (JS) */
    --vh: 540px;                               /* altezza viewport video/pannello (JS) */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    background: radial-gradient(1200px 800px at 60% 20%, #144a57, transparent 60%),
                linear-gradient(180deg, var(--bg-a), var(--bg-b));
    font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }
  /* Spotlight sotto tutto */
  #glowLayer{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(260px 260px at var(--mx,50%) var(--my,50%),
        rgba(20,184,166,.22), transparent 60%);
  }
  /* Orologio (ticks + lancetta) SOTTO il video */
  #ellipseLayer{ position:fixed; inset:0; z-index:2; pointer-events:none; }
  #ellipseLayer .tick{ stroke: rgba(220,245,255,.35); stroke-width:2; stroke-linecap:round; }
  #ellipseLayer .center-dot{ fill: rgba(255,255,255,.55) }
  #hand{ stroke:#fff; stroke-width:3; stroke-linecap:round; }
  #handTip{ fill:#fff }
  /* Viewport centrale: video + pannello */
  #viewport{
    position:fixed; z-index:3;
    border-radius:20px; overflow:hidden;
    border: 2px solid rgba(255,255,255,.22);
    background: rgba(0,0,0,.28);
    box-shadow: 0 18px 40px rgba(0,0,0,.42);
    width:var(--vw); height:var(--vh);
    left: calc(50% - var(--vw)/2);
    top:  calc(52% - var(--vh)/2);
  }
  #hero, #panel{ width:100%; height:100%; }
  #hero video{ display:block; width:100%; height:100%; object-fit:cover; }
  #panel{ display:none; position:relative; }
  body.panel-open #panel{ display:block; }
  body.panel-open #hero{ display:none; }
  /* Pannello contenuti (solido, non trasparente) */
  .panel-wrap{
    position:absolute; inset:0;
    display:flex; flex-direction:column; gap:12px;
    padding:20px 22px 16px;
    color:#f6fafb;
    /* Colore pieno per tasto (iniettato inline come --panel) */
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--panel, #1f3a3d) 92%, black 8%),
      color-mix(in srgb, var(--panel, #1f3a3d) 88%, black 12%));
  }
  .panel-top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    border-radius:999px; padding:6px 10px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    font-weight:700; font-size:14px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.08) inset;
  }
  .chip::before{
    content:""; width:10px; height:10px; border-radius:50%;
    background: var(--panel, #14b8a6); box-shadow:0 0 12px var(--panel, #14b8a6);
  }
  .panel-title{ font-size: clamp(18px, 2.2vw, 28px); font-weight:900; letter-spacing:.3px; }
  .panel-sub{ color: rgba(240,255,255,.9); font-weight:600; }
  .panel-body{ margin-top:4px; color:#d6eef1; }
  .cta-row{ margin-top:auto; display:flex; flex-wrap:wrap; gap:10px; }
  .btn-prim{
    appearance:none; border:none; cursor:pointer;
    padding:.65rem 1rem; border-radius:12px;
    color:#0c1b1e; background:#fff; font-weight:800;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .btn-sec{
    appearance:none; border:2px solid rgba(255,255,255,.3); cursor:pointer;
    padding:.6rem 1rem; border-radius:12px;
    color:#f3feff; background:transparent; font-weight:800;
    backdrop-filter: blur(4px);
  }
  /* Pulsanti orologio SOPRA tutto */
  .node{
    position:fixed; z-index:4; pointer-events:auto;
    width:var(--btnW); height:var(--btnW); border-radius:16px;
    border: 2px solid rgba(255,255,255,.16);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    color: var(--ink);
    display:grid; place-items:center;
    box-shadow: 0 10px 22px rgba(0,0,0,.28), inset 0 0 0 0 rgba(255,255,255,.15);
    backdrop-filter: blur(4px);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .node:hover{
    /* glow forte teal neutro: i colori per-indice si possono riattivare più avanti */
    box-shadow:
      0 0 0 4px var(--accent),
      0 0 22px 8px color-mix(in srgb, var(--accent) 80%, transparent),
      0 12px 28px rgba(0,0,0,.55),
      inset 0 0 0 2px rgba(255,255,255,.25);
    border-color: color-mix(in srgb, var(--accent) 70%, #ffffff 15%);
    transform: translateY(-2px);
  }
  .node .tag{ font-weight:800; letter-spacing:.02em; opacity:.95; }
  /* Header titolo */
  .claim{
    position:fixed; right:22px; top:24px; z-index:4;
    text-align:right; margin:0; line-height:1.1; letter-spacing:.02em;
  }
  .claim b{ display:block; font-size:28px }
  .claim small{ display:block; opacity:.85; font-size:14px; margin-top:6px }
  /* Toolbar */
  .toolbar{ position:fixed; left:20px; top:20px; z-index:4; display:flex; gap:8px; }
  .btn{
    appearance:none; border:none; cursor:pointer;
    padding:.55rem .9rem; border-radius:12px;
    color:var(--ink); background:rgba(20,80,100,.68);
    border:2px solid rgba(255,255,255,.18);
    backdrop-filter: blur(6px);
    font-weight:800;
  }
  /* Accessibilità: niente animazioni se preferito */
  @media (prefers-reduced-motion: reduce){
    #ellipseLayer .tick, #hand, #handTip{ transition:none !important; }
    .node{ transition:none !important; }
  }
  @media (max-width:1200px){ :root{ --btnW: 120px } }
  @media (max-width:900px){  :root{ --btnW: 104px } }
</style>
</head>
<body>

  <div id="glowLayer" aria-hidden="true"></div>
  <svg id="ellipseLayer" aria-hidden="true"></svg>

  <div class="toolbar">
    <a class="btn" href="../index.html">🎬 Spot</a>
    <a class="btn" href="../mindmap.html">🧠 Mappa</a>
  </div>

  <h1 class="claim">
    <b>GEMELLO DIGITALE</b>
    <b>DEL COMMERCIO</b>
    <small>DMS • Orologio roadmap</small>
  </h1>

  <div id="viewport" role="region" aria-label="contenuti">
    <div id="hero">
      <video id="heroVideo"
        src="../videos/video-hero.mp4"
        muted playsinline webkit-playsinline loop preload="metadata"
      ></video>
    </div>
    <div id="panel">
      <div class="panel-wrap" id="panelWrap" style="--panel:#14b8a6">
        <div class="panel-top">
          <span class="chip">Percorso</span>
          <div class="panel-title" id="panelTitle">Titolo modulo</div>
        </div>
        <div class="panel-sub" id="panelSub">Sottotitolo o payoff</div>
        <div class="panel-body" id="panelBody">
          Testo descrittivo breve. Qui mettiamo perché è importante, chi coinvolge e l’azione concreta.
        </div>
        <div class="cta-row" id="panelCtas">
          <a class="btn-prim" target="_blank" href="#">Apri PDF</a>
          <button class="btn-sec" id="btnBack">Torna al video</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 12 pulsanti nel markup: niente flicker -->
  <button class="node" data-i="0"><span class="tag">PDF</span></button>
  <button class="node" data-i="1"><span class="tag">PDF</span></button>
  <button class="node" data-i="2"><span class="tag">PDF</span></button>
  <button class="node" data-i="3"><span class="tag">PDF</span></button>
  <button class="node" data-i="4"><span class="tag">PDF</span></button>
  <button class="node" data-i="5"><span class="tag">PDF</span></button>
  <button class="node" data-i="6"><span class="tag">PDF</span></button>
  <button class="node" data-i="7"><span class="tag">PDF</span></button>
  <button class="node" data-i="8"><span class="tag">PDF</span></button>
  <button class="node" data-i="9"><span class="tag">PDF</span></button>
  <button class="node" data-i="10"><span class="tag">PDF</span></button>
  <button class="node" data-i="11"><span class="tag">PDF</span></button>

<script>
(function(){
  /* ===== Spotlight mouse leggero (sotto tutto) ===== */
  const glow = document.getElementById('glowLayer');
  let needs=false, mx=0, my=0;
  window.addEventListener('pointermove', (e)=>{
    mx = e.clientX; my = e.clientY;
    if(!needs){ needs=true; requestAnimationFrame(()=>{
      glow.style.setProperty('--mx', mx+'px');
      glow.style.setProperty('--my', my+'px');
      needs=false;
    });}
  }, {passive:true});

  /* ===== Layout: ellisse sicura + viewport centrato ===== */
  const svg = document.getElementById('ellipseLayer');
  const viewport = document.getElementById('viewport');
  const hero = document.getElementById('hero');
  const video = document.getElementById('heroVideo');

  function ensureAutoplay(){
    if(!video) return;
    const tryPlay = ()=> video.play().catch(()=>{});
    video.muted = true; video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
    if(document.visibilityState === 'visible') tryPlay();
    document.addEventListener('visibilitychange', tryPlay, {once:true});
    video.addEventListener('loadeddata', tryPlay, {once:true});
  }

  function layout(){
    const W = window.innerWidth, H = window.innerHeight;
    /* viewport 16:9 con margini */
    let vw = Math.min(Math.round(W * 0.58), 1100);
    let vh = Math.round(vw * 9/16);
    const maxH = Math.round(H * 0.48);
    if(vh > maxH){ vh = maxH; vw = Math.round(vh * 16/9); }
    document.documentElement.style.setProperty('--vw', vw+'px');
    document.documentElement.style.setProperty('--vh', vh+'px');
    viewport.style.left = (W/2 - vw/2) + 'px';
    viewport.style.top  = (H*0.52 - vh/2) + 'px';

    /* dimensione pulsanti */
    const btnW = Math.max(100, Math.min(Math.round(W*0.09), 150));
    document.documentElement.style.setProperty('--btnW', btnW+'px');

    /* ellisse esterna (semiassi) con SAFE margin */
    const SAFE = 26;
    const cx = W/2, cy = H*0.52;
    const a = Math.min(W*0.44, W/2 - (SAFE + btnW/2));
    const b = Math.min(H*0.34, H/2 - (SAFE + btnW/2));
    drawClock(svg, cx, cy, a, b);
    positionNodes(cx, cy, a, b, btnW);

    /* aggiorna area pannello (uguale al video) */
    // già fatto sopra via CSS vars
  }

  function drawClock(svg, cx, cy, a, b){
    svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
    svg.innerHTML = '';
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    svg.appendChild(g);
    for(let i=0;i<12;i++){
      const t = -Math.PI/2 + 2*Math.PI*i/12;
      const ix=cx+(a-18)*Math.cos(t), iy=cy+(b-18)*Math.sin(t);
      const ex=cx+a*Math.cos(t),      ey=cy+b*Math.sin(t);
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',ix); ln.setAttribute('y1',iy);
      ln.setAttribute('x2',ex); ln.setAttribute('y2',ey);
      ln.setAttribute('class','tick'); g.appendChild(ln);
    }
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',10);
    c.setAttribute('class','center-dot'); g.appendChild(c);
    const hand=document.createElementNS('http://www.w3.org/2000/svg','line');
    hand.id='hand'; hand.setAttribute('x1',cx); hand.setAttribute('y1',cy);
    hand.setAttribute('x2',cx); hand.setAttribute('y2',cy);
    g.appendChild(hand);
    const tip=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    tip.id='handTip'; g.appendChild(tip);

    let start=null;
    function anim(ts){
      if(!start) start=ts;
      const T=12000;
      const th=-Math.PI/2 + 2*Math.PI*((ts-start)%T)/T;
      const px=cx+a*Math.cos(th)*0.95, py=cy+b*Math.sin(th)*0.95;
      hand.setAttribute('x2',px); hand.setAttribute('y2',py);
      const bx=cx+a*Math.cos(th)*0.86, by=cy+b*Math.sin(th)*0.86;
      const nx=-Math.sin(th), ny=Math.cos(th), tipW=18;
      tip.setAttribute('points',`${px},${py} ${bx+nx*tipW},${by+ny*tipW} ${bx-nx*tipW},${by-ny*tipW}`);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  function positionNodes(cx, cy, a, b, btnW){
    const nodes = document.querySelectorAll('.node');
    nodes.forEach((el,i)=>{
      const t = -Math.PI/2 + 2*Math.PI*i/12;
      const x = cx + a*Math.cos(t) - btnW/2;
      const y = cy + b*Math.sin(t) - btnW/2;
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.transform = 'translateZ(0)'; // render hint
    });
  }

  /* ===== Pannello nel rettangolo del video (dimensioni uguali) ===== */
  const palette = [
    '#ef4444', /* 0 rosso acceso */
    '#f97316', /* 1 arancione */
    '#fb923c', /* 2 arancione chiaro */
    '#fbbf24', /* 3 giallo-arancio */
    '#eab308', /* 4 giallo scuro */
    '#fde047', /* 5 giallo */
    '#fef08a', /* 6 giallo acceso (chiaro) */
    '#a3e635', /* 7 verde-giallo */
    '#22c55e', /* 8 verde */
    '#86efac', /* 9 verdino */
    '#34d399', /* 10 azzurro-verdino */
    '#14b8a6'  /* 11 azzurro-blu/teal */
  ];

  const MODULES = {
    0: {
      title: 'DMS — Riaccendiamo il Commercio',
      sub: 'Una visione concreta per riaccendere mercati e città, con i tre pilastri DMS.',
      body: 'Le città oggi perdono vitalità. DMS offre l’“interruttore” per invertire la rotta con una riforma nazionale semplice e attuabile.',
      ctas: [
        {label:'Documento Principale', href:'../docs/DMS - Riaccendiamo i Mercati, Rivitalizziamo le Città.pdf'},
        {label:'Hub Nazionale del Commercio', href:'../docs/HUB NAZIONALE DEL COMMERCIO.pdf'},
        {label:'DMS & CLUST-ER', href:'../docs/DMS E CLUST-ER.pdf'},
        {label:'DMS ECC (Executive)', href:'../docs/DMS ECC.pdf'}
      ]
    }
    // Gli altri indici possono essere riempiti più avanti
  };

  function openPanelByIndex(i){
    const wrap = document.getElementById('panelWrap');
    const title = document.getElementById('panelTitle');
    const sub   = document.getElementById('panelSub');
    const body  = document.getElementById('panelBody');
    const row   = document.getElementById('panelCtas');
    const col   = palette[i % palette.length];
    wrap.style.setProperty('--panel', col);
    const m = MODULES[i] || {title:`Modulo ${i}`, sub:'In preparazione', body:'Contenuti in arrivo.',
      ctas:[{label:'Apri PDF', href:'#'}]};
    title.textContent = m.title; sub.textContent = m.sub; body.textContent = m.body;
    row.innerHTML = '';
    m.ctas.forEach(c=>{
      const a=document.createElement('a'); a.className='btn-prim'; a.target='_blank'; a.rel='noopener';
      a.href=c.href || '#'; a.textContent=c.label || 'Apri';
      row.appendChild(a);
    });
    const back=document.createElement('button');
    back.id='btnBack'; back.className='btn-sec'; back.textContent='Torna al video';
    back.addEventListener('click', closePanel, {once:true});
    row.appendChild(back);

    document.body.classList.add('panel-open');
    document.getElementById('panel').style.display='block';
  }
  function closePanel(){
    document.body.classList.remove('panel-open');
    document.getElementById('panel').style.display='none';
  }

  function bindNodes(){
    document.querySelectorAll('.node').forEach((el)=>{
      el.addEventListener('click', ()=>{
        const i = +el.dataset.i;
        openPanelByIndex(i);
      });
    });
  }

  /* Disattiva click sui quadrati quando pannello aperto */
  const styleBlock = document.createElement('style');
  styleBlock.textContent = `body.panel-open .node{ pointer-events:none !important; }`;
  document.head.appendChild(styleBlock);

  /* Bootstrap */
  function boot(){
    layout(); ensureAutoplay(); bindNodes();
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  }else{
    boot();
  }
  window.addEventListener('resize', ()=>{ layout(); });
  window.addEventListener('pageshow', ()=>{ layout(); });
})();
</script>
</body>
</html>
